version: "3"
networks:
  openhim:

services:
  mongo-db:
    container_name: mongo-db
    image: mongo:4.0
    networks:
      - openhim
    volumes:
      - "mongo-data:/data/db"
    ports:
      - "127.0.0.1:27017:27017"
    restart: unless-stopped

  openhim-core:
    container_name: openhim-core
    build:
      context: ../../nxdx-backend-core
      dockerfile: Dockerfile
    image: nexacon-openhim-core:latest
    restart: unless-stopped
    environment:
      mongo_url: "mongodb://mongo-db/openhim-dev"
      mongo_atnaUrl: "mongodb://mongo-db/openhim-dev"
      NODE_ENV: "production"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_SUCCESS_URL: "${STRIPE_SUCCESS_URL:-https://localhost:9090/#!/subscriptions?payment=success}"
      STRIPE_CANCEL_URL: "${STRIPE_CANCEL_URL:-https://localhost:9090/#!/subscriptions?payment=cancelled}"
      # Snippe payment integration
      SNIPPE_API_KEY: "${SNIPPE_API_KEY:-}"
      SNIPPE_WEBHOOK_SECRET: "${SNIPPE_WEBHOOK_SECRET:-}"
      SNIPPE_BASE_URL: "${SNIPPE_BASE_URL:-https://api.snippe.sh}"
      SNIPPE_WEBHOOK_URL: "${SNIPPE_WEBHOOK_URL:-}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6000:5000"
      - "127.0.0.1:6001:5001"
    networks:
      - openhim
    healthcheck:
      test: "curl -sS http://openhim-core:8080/heartbeat || exit 1"
      interval: 30s
      timeout: 30s
      retries: 3

  openhim-console:
    container_name: openhim-console
    image: nexacon-openhim-console:latest
    restart: unless-stopped
    networks:
      - openhim
    ports:
      - "127.0.0.1:9090:80"
    volumes:
      - "../app/config/default.json:/usr/share/nginx/html/config/default.json"
    healthcheck:
      test: "curl -sS http://openhim-console || exit 1"
      interval: 30s
      timeout: 30s
      retries: 3

volumes:
  mongo-data:
